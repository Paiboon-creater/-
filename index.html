<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGUAR_PRODUCTION - ALL DATA SUMMARY</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-red: #ff3333;
            --dark-bg: #030a05;
            --panel-bg: rgba(3, 15, 8, 0.85);
            --text-main: #e2f0ea;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                linear-gradient(rgba(3, 10, 5, 0.8), rgba(3, 10, 5, 0.9)),
                url('image_bb0922.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 80px 20px 40px 20px;
        }

        /* ปุ่ม Home */
        .btn-home {
            position: fixed; top: 20px; left: 20px;
            background: linear-gradient(135deg, #fdf6d0 0%, #d6ba5b 100%);
            border: 1px solid #b69c3b; color: #3a2e0b;
            padding: 10px 20px; border-radius: 8px; font-size: 1rem;
            font-weight: bold; cursor: pointer; text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1000;
            display: flex; align-items: center; gap: 8px; transition: all 0.2s;
        }
        .btn-home:hover {
            transform: scale(1.05); background: linear-gradient(135deg, #fffce1 0%, #efdf93 100%);
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4); border-color: #ffcc00;
        }

        /* คอนเทนเนอร์และตาราง */
        .table-container {
            width: 100%; max-width: 1400px; margin: 0 auto;
            background: var(--panel-bg); border: 1px solid rgba(0, 255, 65, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1); border-radius: 12px;
            backdrop-filter: blur(10px); padding: 30px; overflow-x: auto;
        }

        .header-title { text-align: center; margin-bottom: 25px; }
        .header-title h1 { color: var(--neon-green); font-size: 1.8rem; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 255, 65, 0.4); }
        .header-title p { color: #a4c2b4; font-size: 0.9rem; margin-top: 5px; }

        table {
            width: 100%; border-collapse: collapse; text-align: left;
            white-space: nowrap; table-layout: auto;
        }

        thead {
            background-color: rgba(0, 255, 65, 0.1);
            border-bottom: 2px solid var(--neon-green);
        }

        th {
            padding: 12px 10px; font-weight: 600; color: #ffffff;
            font-size: 0.95rem; vertical-align: top;
            min-width: 130px; /* บังคับความกว้างขั้นต่ำ */
        }

        /* จัดระเบียบข้อความหัวตารางและช่องกรองให้อยู่บน-ล่าง */
        .th-content {
            display: flex; flex-direction: column; gap: 8px;
        }

        .th-title-row {
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; padding: 4px 0; user-select: none; transition: 0.2s;
        }
        .th-title-row:hover { color: var(--neon-green); }
        
        .sort-icon { font-size: 0.85rem; color: #555; transition: 0.2s; }
        .sort-icon.active { color: var(--neon-green); }

        /* กล่องตัวกรองแบบ Select และ Input */
        .filter-select, .filter-input {
            width: 100%; padding: 6px; background: #031207;
            color: var(--neon-green); border: 1px solid var(--neon-green);
            border-radius: 4px; font-size: 0.85rem; outline: none; cursor: pointer;
        }
        .filter-select option { background: #031207; color: #fff; }
        .filter-input { cursor: text; }
        .filter-input::placeholder { color: #2e6c43; font-style: italic; }

        td {
            padding: 12px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem; font-weight: 400;
        }

        tbody tr { transition: background 0.2s; }
        tbody tr:hover { background-color: rgba(0, 255, 65, 0.05); }

        /* สีพิเศษสำหรับข้อมูล */
        .col-order { color: #00ffff; font-weight: bold; }
        .col-po { color: #ffb347; } /* สีสำหรับ PO */
        .col-work { color: #e2e8f0; }
        .col-step { color: #a855f7; font-weight: 600; }
        .col-qty { color: #ffffff; }
        .col-percent { color: #eab308; font-weight: bold; }
        
        .status-green { color: #00ff41; }
        .status-red { color: #ff3333; font-weight: bold; }
        .status-orange { color: #f59e0b; font-weight: bold; }
        .status-gray { color: #9ca3af; }

        .loading-row {
            text-align: center; color: var(--neon-green); padding: 40px !important;
            font-weight: bold; letter-spacing: 2px; font-size: 1.2rem;
        }

        /* ส่วนเปลี่ยนหน้า (Pagination) */
        .pagination-container {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(0, 255, 65, 0.2);
        }
        .page-info { color: #a4c2b4; font-size: 0.95rem; }
        .pagination-controls { display: flex; gap: 10px; }
        .btn-page {
            background: rgba(0, 255, 65, 0.1); color: var(--neon-green);
            border: 1px solid var(--neon-green); padding: 8px 15px; border-radius: 6px;
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn-page:hover:not(:disabled) { background: var(--neon-green); color: #000; }
        .btn-page:disabled {
            background: rgba(255, 255, 255, 0.05); color: #555;
            border-color: #555; cursor: not-allowed;
        }
    </style>
</head>
<body>

    <a href="https://paiboon-creater.github.io/Data_Information_Jaguar_productions/" class="btn-home hover-sound">
        <i class="fa-solid fa-house"></i> กลับหน้าหลัก (Home)
    </a>

    <div class="table-container">
        <div class="header-title">
            <h1>สรุปงานผลิตทั้งหมดในระบบ</h1>
            <p>ตารางข้อมูลอัปเดตล่าสุด (แสดงผลหน้าละ 20 รายการ)</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>
                        <div class="th-content">
                            <div class="th-title-row" onclick="sortBy('orderNo')">
                                <span>เลขที่ใบสั่ง</span>
                                <i id="sort-orderNo" class="fa-solid fa-sort sort-icon"></i>
                            </div>
                            <!-- เปลี่ยนเป็นช่อง Input สามารถพิมพ์ค้นหาได้ -->
                            <input type="text" id="filterOrder" class="filter-input" placeholder="พิมพ์ค้นหาใบสั่ง..." list="orderList" oninput="applyFilters()" onclick="event.stopPropagation()">
                            <datalist id="orderList"></datalist>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <div class="th-title-row" onclick="sortBy('poNo')">
                                <span>เลขที่ PO</span>
                                <i id="sort-poNo" class="fa-solid fa-sort sort-icon"></i>
                            </div>
                            <select id="filterPo" class="filter-select" onclick="event.stopPropagation()" onchange="applyFilters()">
                                <option value="ALL">ทั้งหมด</option>
                            </select>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <div class="th-title-row" onclick="sortBy('workCode')">
                                <span>รหัสชิ้นงาน</span>
                                <i id="sort-workCode" class="fa-solid fa-sort sort-icon"></i>
                            </div>
                            <select id="filterWork" class="filter-select" onclick="event.stopPropagation()" onchange="applyFilters()">
                                <option value="ALL">ทั้งหมด</option>
                            </select>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <div class="th-title-row" onclick="sortBy('stepName')">
                                <span>ขั้นตอนทำงาน</span>
                                <i id="sort-stepName" class="fa-solid fa-sort sort-icon"></i>
                            </div>
                            <select id="filterStep" class="filter-select" onclick="event.stopPropagation()" onchange="applyFilters()">
                                <option value="ALL">ทั้งหมด</option>
                            </select>
                        </div>
                    </th>
                    <th style="min-width: 100px;">
                        <div class="th-content">
                            <div class="th-title-row" onclick="sortBy('qty')" style="justify-content: flex-end;">
                                <i id="sort-qty" class="fa-solid fa-sort sort-icon" style="margin-right: 8px;"></i>
                                <span>ยอดสั่ง(ชิ้น)</span>
                            </div>
                            <div style="height: 28px;"></div>
                        </div>
                    </th>
                    <th style="min-width: 100px;">
                        <div class="th-content">
                            <div class="th-title-row" onclick="sortBy('produced')" style="justify-content: flex-end;">
                                <i id="sort-produced" class="fa-solid fa-sort sort-icon" style="margin-right: 8px;"></i>
                                <span>ผลิตได้(ชิ้น)</span>
                            </div>
                            <div style="height: 28px;"></div>
                        </div>
                    </th>
                    <th style="min-width: 80px;">
                        <div class="th-content">
                            <div class="th-title-row" onclick="sortBy('percent')" style="justify-content: flex-end;">
                                <i id="sort-percent" class="fa-solid fa-sort sort-icon" style="margin-right: 8px;"></i>
                                <span>%</span>
                            </div>
                            <div style="height: 28px;"></div>
                        </div>
                    </th>
                    <th>
                        <div class="th-content">
                            <div class="th-title-row" onclick="sortBy('statusCat')" style="justify-content: center;">
                                <span>สถานะกำหนดส่ง</span>
                                <i id="sort-statusCat" class="fa-solid fa-sort sort-icon" style="margin-left: 8px;"></i>
                            </div>
                            <select id="filterStatus" class="filter-select" onclick="event.stopPropagation()" onchange="applyFilters()">
                                <option value="ALL">ทั้งหมด</option>
                                <option value="RED">เลยกำหนดแล้ว</option>
                                <option value="ORANGE">ครบกำหนดวันนี้</option>
                                <option value="GREEN">ยังไม่ถึงกำหนด</option>
                                <option value="NONE">ไม่มีกำหนดเสร็จ</option>
                            </select>
                        </div>
                    </th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="8" class="loading-row">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> กำลังดึงข้อมูลทั้งหมด กรุณารอสักครู่...
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- ส่วนควบคุมหน้าจอ (Pagination) -->
        <div class="pagination-container">
            <div class="page-info" id="pageInfo">กำลังเตรียมข้อมูล...</div>
            <div class="pagination-controls">
                <button class="btn-page hover-sound" id="btnPrev" onclick="changePage(-1)" disabled>
                    <i class="fa-solid fa-chevron-left"></i> หน้าก่อนหน้า
                </button>
                <button class="btn-page hover-sound" id="btnNext" onclick="changePage(1)" disabled>
                    หน้าถัดไป <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

<script>
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    }
    function playMetallicClick() {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.03);
        gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
    }
    document.querySelectorAll('.hover-sound').forEach(btn => {
        btn.addEventListener('mouseenter', () => { initAudio(); playMetallicClick(); });
    });
    document.body.addEventListener('click', initAudio, { once: true });
    document.body.addEventListener('mousemove', initAudio, { once: true });

    const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
    const headers = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" };

    let rawData = [];
    let filteredData = [];
    let currentPage = 1;
    const rowsPerPage = 20;
    
    // ตั้งค่าเริ่มต้นของการจัดเรียง (Sort)
    let currentSort = { key: 'orderNo', order: 'desc' };

    async function fetchAllData() {
        try {
            // ดึงข้อมูลเพิ่ม po_no มาจากตาราง orders
            const [ordersRes, targetsRes, stepsRes, orderStepsRes, allProdRes, workItemsRes] = await Promise.all([
                fetch(`${SUPABASE_URL}/orders?select=id_order,order_no,po_no,quantity,id_work&limit=10000`, { headers }),
                fetch(`${SUPABASE_URL}/targets?select=id_target,id_step,id_work&limit=10000`, { headers }),
                fetch(`${SUPABASE_URL}/production_steps?select=id_step,step_name&limit=10000`, { headers }),
                fetch(`${SUPABASE_URL}/order_steps?select=id_order,id_step,end_date&limit=10000`, { headers }),
                fetch(`${SUPABASE_URL}/daily_production?select=id_order,id_target,produced_amount&limit=10000`, { headers }),
                fetch(`${SUPABASE_URL}/work_items?select=id_work,work_code&limit=10000`, { headers })
            ]);

            const orders = await ordersRes.json();
            const targets = await targetsRes.json();
            const steps = await stepsRes.json();
            const orderSteps = await orderStepsRes.json();
            const allProd = await allProdRes.json();
            const workItems = await workItemsRes.json();

            let today = new Date();
            today.setHours(0,0,0,0);

            rawData = [];
            
            orderSteps.forEach(os => {
                let order = orders.find(o => o.id_order === os.id_order);
                if(!order) return; 
                
                let step = steps.find(s => s.id_step === os.id_step);
                let target = targets.find(t => t.id_step === os.id_step && t.id_work === order.id_work);
                
                let workItem = workItems.find(w => w.id_work === order.id_work);
                let workCodeText = workItem ? workItem.work_code : "ไม่ระบุ";

                let totalProd = 0;
                if (target) {
                    allProd.forEach(p => {
                        if(p.id_order === os.id_order && p.id_target === target.id_target) {
                            totalProd += (p.produced_amount || 0);
                        }
                    });
                }

                let qty = parseInt(order.quantity) || 0;
                let percent = qty > 0 ? (totalProd / qty) * 100 : 0;

                let diffDays = 0;
                let statusCat = "NONE"; 
                let statusText = `<span class="status-gray">ไม่มีกำหนดเสร็จ</span>`;
                
                if (os.end_date) {
                    let ed = new Date(os.end_date); ed.setHours(0,0,0,0);
                    let diffTime = ed.getTime() - today.getTime();
                    diffDays = Math.ceil(diffTime / (1000*60*60*24));

                    if (diffDays < 0) { 
                        statusCat = "RED"; 
                        statusText = `<span class="status-red"><i class="fa-solid fa-circle-exclamation"></i> เลยกำหนด ${Math.abs(diffDays)} วัน</span>`; 
                    }
                    else if (diffDays > 0) { 
                        statusCat = "GREEN"; 
                        statusText = `<span class="status-green"><i class="fa-regular fa-clock"></i> เหลือเวลา ${diffDays} วัน</span>`; 
                    }
                    else { 
                        statusCat = "ORANGE"; 
                        statusText = `<span class="status-orange"><i class="fa-solid fa-bell"></i> ครบกำหนดวันนี้!</span>`; 
                    }
                }

                rawData.push({
                    orderNo: order.order_no || "-",
                    poNo: order.po_no || "-", // เพิ่ม PO Number
                    workCode: workCodeText,
                    stepName: step ? step.step_name : "-",
                    qty: qty,
                    produced: totalProd,
                    percent: percent,
                    statusCat: statusCat,
                    statusText: statusText
                });
            });

            applyFilters();

        } catch (error) {
            console.error("Fetch Error:", error);
            document.getElementById('tableBody').innerHTML = `
                <tr><td colspan="8" class="status-red" style="text-align: center; padding: 20px;">
                    <i class="fa-solid fa-triangle-exclamation"></i> ไม่สามารถเชื่อมต่อฐานข้อมูลได้
                </td></tr>`;
        }
    }

    // ---- ระบบจัดเรียง (Sorting) สลับการเรียงเมื่อกดซ้ำ ----
    function sortBy(key) {
        initAudio(); playMetallicClick();
        if (currentSort.key === key) {
            // ถ้ากดที่คอลัมน์เดิม ให้สลับ ASC เป็น DESC หรือ DESC เป็น ASC
            currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
        } else {
            // ถ้ากดคอลัมน์ใหม่ เริ่มต้นด้วย ASC เสมอ
            currentSort.key = key;
            currentSort.order = 'asc';
        }
        applyFilters(); 
    }

    // อัปเดตไอคอนจัดเรียง (ลูกศรขึ้น/ลง)
    function updateSortIcons() {
        document.querySelectorAll('.sort-icon').forEach(icon => {
            icon.className = 'fa-solid fa-sort sort-icon';
            icon.classList.remove('active');
        });
        
        let activeIcon = document.getElementById('sort-' + currentSort.key);
        if (activeIcon) {
            activeIcon.className = currentSort.order === 'asc' ? 'fa-solid fa-sort-up sort-icon active' : 'fa-solid fa-sort-down sort-icon active';
        }
    }

    // ---- ระบบกรองข้อมูล (Filters) ----
    function applyFilters() {
        let fOrder = document.getElementById('filterOrder').value.trim().toLowerCase();
        let fPo = document.getElementById('filterPo').value;
        let fWork = document.getElementById('filterWork').value;
        let fStep = document.getElementById('filterStep').value;
        let fStatus = document.getElementById('filterStatus').value;

        // 1. กรอง (รองรับการพิมพ์บางส่วนสำหรับช่องใบสั่ง)
        filteredData = rawData.filter(item => {
            let matchOrder = (fOrder === '' || item.orderNo.toLowerCase().includes(fOrder));
            
            return matchOrder &&
                   (fPo === 'ALL' || item.poNo === fPo) &&
                   (fWork === 'ALL' || item.workCode === fWork) &&
                   (fStep === 'ALL' || item.stepName === fStep) &&
                   (fStatus === 'ALL' || item.statusCat === fStatus);
        });

        // 2. จัดเรียง
        filteredData.sort((a, b) => {
            let valA = a[currentSort.key];
            let valB = b[currentSort.key];

            if (typeof valA === 'number') {
                return currentSort.order === 'asc' ? valA - valB : valB - valA;
            } else {
                valA = valA.toString().toLowerCase();
                valB = valB.toString().toLowerCase();
                if (valA < valB) return currentSort.order === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.order === 'asc' ? 1 : -1;
                return 0;
            }
        });

        // 3. อัปเดต UI Dropdown และ Datalist
        updateDatalistOptions('orderList', 'orderNo'); // อัปเดตลิสต์ใบสั่งสำหรับค้นหา
        updateDropdownOptions('filterPo', 'poNo', fPo);
        updateDropdownOptions('filterWork', 'workCode', fWork);
        updateDropdownOptions('filterStep', 'stepName', fStep);
        
        updateSortIcons();

        currentPage = 1;
        renderTable();
    }

    // อัปเดต Datalist (สำหรับช่องกรอกข้อมูล)
    function updateDatalistOptions(listId, dataKey) {
        let uniqueValues = [...new Set(rawData.map(item => item[dataKey]))].sort();
        const list = document.getElementById(listId);
        list.innerHTML = '';
        uniqueValues.forEach(val => {
            let opt = document.createElement('option');
            opt.value = val;
            list.appendChild(opt);
        });
    }

    // อัปเดต Dropdown ปกติ (Select)
    function updateDropdownOptions(selectId, dataKey, currentValue) {
        let uniqueValues = [...new Set(filteredData.map(item => item[dataKey]))].sort();
        if (currentValue !== 'ALL' && !uniqueValues.includes(currentValue)) {
            uniqueValues.push(currentValue);
        }

        const select = document.getElementById(selectId);
        select.innerHTML = '<option value="ALL">ทั้งหมด</option>';
        
        uniqueValues.forEach(val => {
            let opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val;
            if (val === currentValue) opt.selected = true;
            select.appendChild(opt);
        });
    }

    // ---- แสดงผลตาราง ----
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        let totalPages = Math.ceil(filteredData.length / rowsPerPage);
        if(totalPages === 0) totalPages = 1;

        let startIndex = (currentPage - 1) * rowsPerPage;
        let endIndex = startIndex + rowsPerPage;
        let pageData = filteredData.slice(startIndex, endIndex);

        if (pageData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:#9ca3af;">ไม่พบข้อมูลที่ตรงกับตัวกรอง</td></tr>`;
        } else {
            let htmlRows = "";
            pageData.forEach(item => {
                htmlRows += `
                    <tr>
                        <td class="col-order">${item.orderNo}</td>
                        <td class="col-po">${item.poNo}</td>
                        <td class="col-work">${item.workCode}</td>
                        <td class="col-step">${item.stepName}</td>
                        <td class="col-qty" style="text-align: right;">${item.qty.toLocaleString()}</td>
                        <td class="col-qty" style="text-align: right;">${item.produced.toLocaleString()}</td>
                        <td class="col-percent" style="text-align: right;">${item.percent.toFixed(1)}%</td>
                        <td style="text-align: center;">${item.statusText}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = htmlRows;
        }

        document.getElementById('pageInfo').innerHTML = `หน้า <b style="color:#00ff41;">${currentPage}</b> จาก ${totalPages} &nbsp; <span style="color:#666;">(รวม ${filteredData.length} รายการ)</span>`;
        document.getElementById('btnPrev').disabled = (currentPage === 1);
        document.getElementById('btnNext').disabled = (currentPage === totalPages || filteredData.length === 0);
    }

    function changePage(direction) {
        initAudio(); playMetallicClick();
        let totalPages = Math.ceil(filteredData.length / rowsPerPage);
        
        currentPage += direction;
        if(currentPage < 1) currentPage = 1;
        if(currentPage > totalPages) currentPage = totalPages;
        
        renderTable();
    }

    document.addEventListener("DOMContentLoaded", fetchAllData);
</script>
</body>
</html>
